<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Article – MeridianMatters</title>
  <meta name="description" id="page-description" content="Stay informed with the latest in global news, sports, health, and finance. Powered by MeridianMatters.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .article-wrap { max-width: 760px; margin: 0 auto; padding: 2rem 0 4rem; }
    .article-wrap .article-category {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .article-wrap h1 {
      font-family: var(--font-display); font-size: 2rem; font-weight: 800;
      line-height: 1.2; margin: 0.5rem 0 0.75rem;
    }
    .article-wrap .article-meta {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .article-wrap .article-hero-image {
      width: 100%; max-height: 420px; object-fit: cover; margin-bottom: 1.5rem;
    }
    .article-wrap .article-body { font-size: 1.05rem; line-height: 1.7; }
    .article-wrap .article-body p { margin-bottom: 1.1rem; }
    .article-wrap .not-found { padding: 3rem 0; text-align: center; color: var(--text-muted); }
    .article-wrap .back-link {
      display: inline-block; margin-top: 2rem; font-family: var(--font-mono);
      font-size: 0.8rem; color: var(--accent); text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Meridian<span>Matters</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="news.html">Global News</a>
        <a href="sports.html">Sports</a>
        <a href="health.html">Health</a>
        <a href="finance.html">Finance</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div class="wire-ticker" id="wire-ticker"></div>

  <main>
    <div class="container article-wrap" id="article-content">
      <p style="color: var(--text-muted);">Loading article…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo">Meridian<span>Matters</span></div>
          <p>Your trusted source for global news, sports, health, and finance insights.</p>
        </div>
        <div class="footer-links">
          <div>
            <h4>Sections</h4>
            <a href="news.html">Global News</a>
            <a href="sports.html">Sports</a>
            <a href="health.html">Health</a>
            <a href="finance.html">Finance</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2026 MeridianMatters. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      const categoryMap = { news: 'Global News', sports: 'Sports', health: 'Health', finance: 'Finance' };

      function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      // Article content in articles.json is plain text with blank-line
      // separated paragraphs (matches the admin panel's "Full content"
      // field help text) — split and wrap in <p> tags.
      function renderBody(content) {
        return (content || '')
          .split(/\n\s*\n/)
          .map(p => `<p>${p.trim()}</p>`)
          .join('');
      }

      function showNotFound() {
        const container = document.getElementById('article-content');
        container.innerHTML = `
          <div class="not-found">
            <h1>Article not found</h1>
            <p>This story may have been removed or the link is incorrect.</p>
            <a class="back-link" href="index.html">← Back to homepage</a>
          </div>
        `;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('article-content');
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
          showNotFound();
          return;
        }

        if (!window.MM || typeof window.MM.loadArticles !== 'function') {
          container.innerHTML = '<p style="color:var(--text-muted);">Could not load article data.</p>';
          return;
        }

        const articles = await window.MM.loadArticles();
        const article = articles.find(a => a.id === id);

        if (!article) {
          showNotFound();
          return;
        }

        const categoryLabel = categoryMap[article.category] || article.category;

        document.title = `${article.title} – MeridianMatters`;
        document.getElementById('page-title').textContent = `${article.title} – MeridianMatters`;
        const descEl = document.getElementById('page-description');
        if (descEl) descEl.setAttribute('content', article.summary || '');

        container.innerHTML = `
          <span class="article-category">${categoryLabel}</span>
          <h1>${article.title}</h1>
          <div class="article-meta">
            ${formatDate(article.date)} · By ${article.author || 'Unknown'}
          </div>
          ${article.image ? `<img class="article-hero-image" src="${article.image}" alt="${article.imageAlt || article.title}">` : ''}
          <div class="article-body">${renderBody(article.content)}</div>
          <a class="back-link" href="index.html">← Back to homepage</a>
        `;
      });
    })();
  </script>
</body>
</html>
