<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article – MeridianMatters</title>
  <meta name="description" content="Read the full article on MeridianMatters.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .article-page { max-width: 720px; margin: 0 auto; padding: 2.25rem 0 4rem; }
    .article-page .back-link {
      display: inline-flex; align-items: center; gap: 0.35rem; margin-bottom: 1.5rem;
      font-family: var(--font-mono); font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--accent); font-weight: 600;
    }
    .article-page .back-link:hover { color: var(--accent-hover); }
    .article-page .category-tag {
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 0.75rem;
    }
    .article-page h1 {
      font-family: var(--font-display); font-size: clamp(1.7rem, 4.2vw, 2.5rem);
      font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 1rem;
    }
    .article-page .meta {
      font-family: var(--font-mono); color: var(--text-muted); font-size: 0.82rem;
      text-transform: uppercase; letter-spacing: 0.02em;
      margin-bottom: 1.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule);
      display: flex; flex-wrap: wrap; gap: 0.6rem;
    }
    .article-page .hero-image {
      width: 100%; border-radius: 0; margin-bottom: 0.4rem; aspect-ratio: 16/9;
      object-fit: cover; background: var(--bg-alt);
    }
    .article-page .hero-image-credit {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
      margin-bottom: 1.75rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .article-page .content { font-size: 1.08rem; line-height: 1.75; color: var(--text); font-family: var(--font-body); }
    .article-page .content p { margin-bottom: 1.25rem; }
    .article-page .content img {
      width: 100%; border-radius: 0; margin: 0.5rem 0 0.3rem; aspect-ratio: 16/9; object-fit: cover;
    }
    .article-page .content .img-caption {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted);
      margin-bottom: 1.75rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .article-page .content .source-link,
    .article-page .content .inline-link {
      color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor;
    }
    .article-page .content .source-link:hover,
    .article-page .content .inline-link:hover { color: var(--accent-hover); }
    .article-page .loading, .article-page .error { color: var(--text-muted); padding: 3rem 0; text-align: center; font-family: var(--font-mono); font-size: 0.85rem; }

    .next-article {
      display: block; margin-top: 2.5rem; padding: 1.25rem 1.4rem;
      border: 1px solid var(--rule-strong); text-decoration: none;
    }
    .next-article .label {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem;
    }
    .next-article h4 {
      font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--text);
    }
    .related-section { margin-top: 2.5rem; border-top: 2px solid var(--rule-strong); padding-top: 1.25rem; }
    .related-section h3 {
      font-family: var(--font-display); font-size: 1.1rem; font-weight: 800;
      text-transform: uppercase; margin-bottom: 0.75rem;
    }
    .related-list { display: flex; flex-direction: column; }
    .related-row {
      display: grid; grid-template-columns: 72px 1fr; gap: 0.9rem;
      padding: 0.75rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit;
    }
    .related-row .thumb {
      width: 72px; height: 56px; background: var(--bg-alt); overflow: hidden;
    }
    .related-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .related-row h4 {
      font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; line-height: 1.3;
    }
    .related-row .cat {
      font-family: var(--font-mono); font-size: 0.65rem; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Meridian<span>Matters</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="news.html">Global News</a>
        <a href="sports.html">Sports</a>
        <a href="health.html">Health</a>
        <a href="finance.html">Finance</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div class="wire-ticker" id="wire-ticker"></div>

  <main>
    <div class="container">
      <article class="article-page" id="article-root">
        <p class="loading">Loading article...</p>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo">Meridian<span>Matters</span></div>
          <p>Your trusted source for global news, sports, health, and finance insights.</p>
        </div>
        <div class="footer-links">
          <div>
            <h4>Sections</h4>
            <a href="news.html">Global News</a>
            <a href="sports.html">Sports</a>
            <a href="health.html">Health</a>
            <a href="finance.html">Finance</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2026 MeridianMatters. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (async function () {
      const root = document.getElementById('article-root');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        root.innerHTML = '<p class="error">Article not found.</p>';
        return;
      }

      try {
        const visible = await window.MM.loadArticles();
        const article = visible.find(a => a.id === id);

        if (!article) {
          root.innerHTML = '<p class="error">Article not found.</p>';
          return;
        }

        document.title = article.title + ' – MeridianMatters';

        const categoryMap = { news: 'Global News', sports: 'Sports', health: 'Health', finance: 'Finance' };
        const categoryLabel = categoryMap[article.category] || article.category;
        const dateStr = new Date(article.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        let bodyHtml = '';
        if (article.content) {
          let rawContent = article.content;

          // ---- Cross-links to other MeridianMatters articles ----
          // Converts [[id|visible text]] markers (inserted by the AI
          // generator when relevant) into real internal links. Falls back
          // gracefully if the referenced article no longer exists — the
          // link just leads to the standard "Article not found" page.
          rawContent = rawContent.replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, (m, linkId, text) => {
            return `<a href="article.html?id=${encodeURIComponent(linkId)}" class="inline-link">${text}</a>`;
          });

          const paragraphs = rawContent.split(/\n+/).filter(p => p.trim());

          // ---- Auto-link the source outlet's name (e.g. "BBC") to the
          // original story, first mention only, so it doesn't feel spammy. ----
          if (article.sourceName && article.sourceUrl) {
            const escaped = article.sourceName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const sourceRegex = new RegExp(`\\b(${escaped})\\b`, 'i');
            let linked = false;
            for (let i = 0; i < paragraphs.length; i++) {
              if (linked) break;
              if (sourceRegex.test(paragraphs[i])) {
                paragraphs[i] = paragraphs[i].replace(sourceRegex,
                  `<a href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer" class="source-link">$1</a>`);
                linked = true;
              }
            }
          }

          // Interleave any inline images roughly evenly through the body,
          // the way a real publication breaks up long text — not just one
          // image at the top. Skips gracefully if the article has none.
          const inlineImages = (article.images || []).filter(img => img && img.url);
          const parts = paragraphs.map(p => `<p>${p.trim()}</p>`);

          if (inlineImages.length && paragraphs.length > 3) {
            const slot = Math.floor(parts.length / (inlineImages.length + 1));
            inlineImages.forEach((img, i) => {
              const insertAt = slot * (i + 1) + i; // account for prior insertions shifting index
              const imgHtml = `<img src="${img.url}" alt="${img.alt || article.title}" loading="lazy">` +
                (img.credit ? `<div class="img-caption">${img.credit}</div>` : (img.alt ? `<div class="img-caption">${img.alt}</div>` : ''));
              parts.splice(Math.min(insertAt, parts.length), 0, imgHtml);
            });
          }

          bodyHtml = parts.join('');
        }

        // ---- Related articles: same category (and shared tags if present),
        // most recent first, excluding the current article. ----
        const sameCategory = visible.filter(a => a.id !== article.id && a.category === article.category);
        const articleTags = article.tags || [];
        const scored = sameCategory.map(a => {
          const sharedTags = (a.tags || []).filter(t => articleTags.includes(t)).length;
          return { a, score: sharedTags };
        }).sort((x, y) => y.score - x.score || new Date(y.a.date) - new Date(x.a.date));
        const related = scored.slice(0, 3).map(s => s.a);

        const relatedHtml = related.length ? `
          <div class="related-section">
            <h3>Related in ${categoryLabel}</h3>
            <div class="related-list">
              ${related.map(r => `
                <a href="article.html?id=${encodeURIComponent(r.id)}" class="related-row">
                  <div class="thumb">${r.image ? `<img src="${r.image}" alt="${r.title}" loading="lazy">` : ''}</div>
                  <div>
                    <span class="cat">${categoryMap[r.category] || r.category}</span>
                    <h4>${r.title}</h4>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        ` : '';

        // ---- Next article: chronologically the next-older story overall,
        // so readers can keep moving through the whole feed, not just one
        // category. Wraps to the most recent article at the end of the list. ----
        const chronological = [...visible].sort((a, b) => new Date(b.date) - new Date(a.date));
        const curIdx = chronological.findIndex(a => a.id === article.id);
        const nextArticle = chronological.length > 1
          ? chronological[(curIdx + 1) % chronological.length]
          : null;

        const nextHtml = nextArticle ? `
          <a href="article.html?id=${encodeURIComponent(nextArticle.id)}" class="next-article">
            <div class="label">Next Article →</div>
            <h4>${nextArticle.title}</h4>
          </a>
        ` : '';

        root.innerHTML = `
          <a href="javascript:history.back()" class="back-link">← Back</a>
          <div class="category-tag">${categoryLabel}</div>
          <h1>${article.title}</h1>
          <div class="meta">
            <span>${dateStr}</span>
            <span>·</span>
            <span>By ${article.author}</span>
          </div>
          ${article.image ? `
            <img class="hero-image" src="${article.image}" alt="${article.imageAlt || article.title}" loading="lazy">
            ${article.imageCredit ? `<div class="hero-image-credit">${article.imageCredit}</div>` : ''}
          ` : ''}
          <div class="content">
            ${bodyHtml || `<p>${article.summary}</p>`}
          </div>
          ${nextHtml}
          ${relatedHtml}
        `;
      } catch (err) {
        console.error(err);
        root.innerHTML = '<p class="error">Failed to load article.</p>';
      }
    })();
  </script>
</body>
</html>
