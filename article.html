<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Article – MeridianMatters</title>
  <meta name="description" id="page-description" content="Stay informed with the latest in global news, sports, health, and finance. Powered by MeridianMatters.">
  <meta name="theme-color" content="#14181c">
  <meta property="og:type" content="article" id="og-type">
  <meta property="og:site_name" content="MeridianMatters">
  <meta property="og:title" id="og-title" content="MeridianMatters">
  <meta property="og:description" id="og-description" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2314181c'/%3E%3Cpath d='M7 24V8h3l6 9 6-9h3v16h-3V13l-6 9-6-9v11z' fill='%230ea5e9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="read-progress" id="read-progress" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Meridian<span>Matters</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="news.html">Global News</a>
        <a href="sports.html">Sports</a>
        <a href="health.html">Health</a>
        <a href="finance.html">Finance</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div class="wire-ticker" id="wire-ticker" aria-label="Live headlines"></div>

  <main id="main">
    <div class="container">
      <article class="article-wrap" id="article-content">
        <div class="skeleton sk-line w60"></div>
        <div class="skeleton sk-line lg"></div>
        <div class="skeleton sk-image" style="margin-top:1rem;"></div>
      </article>
      <section class="related" id="related" hidden>
        <div class="section-header"><h2>More in this section</h2></div>
        <div class="article-grid" id="related-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo">Meridian<span>Matters</span></div>
          <p>Your trusted source for global news, sports, health, and finance insights.</p>
        </div>
        <div class="footer-links">
          <div>
            <h4>Sections</h4>
            <a href="news.html">Global News</a>
            <a href="sports.html">Sports</a>
            <a href="health.html">Health</a>
            <a href="finance.html">Finance</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2026 MeridianMatters. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      const { esc, categoryMap, formatDate, readingTime } = window.MM;

      // Article content is plain text with blank-line separated paragraphs
      // (matches the admin panel's "Full content" field) — escape, then wrap in <p>.
      function renderBody(content) {
        return (content || '')
          .split(/\n\s*\n/)
          .filter((p) => p.trim())
          .map((p) => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`)
          .join('');
      }

      function showNotFound() {
        document.getElementById('article-content').innerHTML = `
          <div class="not-found">
            <h1>Article not found</h1>
            <p>This story may have been removed or the link is incorrect.</p>
            <a class="back-link" href="index.html">← Back to homepage</a>
          </div>
        `;
      }

      function setMeta(id, value) {
        const el = document.getElementById(id);
        if (el) el.setAttribute('content', value || '');
      }

      function shareRow(article) {
        const url = encodeURIComponent(window.location.href);
        const text = encodeURIComponent(article.title);
        return `
          <div class="share-row">
            <span class="label">Share</span>
            <a class="share-btn" target="_blank" rel="noopener" href="https://wa.me/?text=${text}%20${url}">WhatsApp</a>
            <a class="share-btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${url}">Facebook</a>
            <a class="share-btn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${text}&url=${url}">X</a>
            <button class="share-btn" type="button" id="copy-link">Copy link</button>
          </div>`;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('article-content');
        const id = new URLSearchParams(window.location.search).get('id');

        if (!id) return showNotFound();

        const articles = await window.MM.loadArticles();
        const article = articles.find((a) => a.id === id);
        if (!article) return showNotFound();

        const categoryLabel = categoryMap[article.category] || article.category;
        const fullTitle = `${article.title} – MeridianMatters`;

        document.title = fullTitle;
        document.getElementById('page-title').textContent = fullTitle;
        setMeta('page-description', article.summary);
        setMeta('og-title', article.title);
        setMeta('og-description', article.summary);
        window.MM.setActiveNav(article.category);

        const meta = [formatDate(article.date), article.author ? 'By ' + esc(article.author) : '', readingTime(article)]
          .filter(Boolean)
          .map((p) => `<span>${p}</span>`)
          .join('<span>·</span>');

        container.innerHTML = `
          <a class="article-category" href="${esc(article.category)}.html">${esc(categoryLabel)}</a>
          <h1>${esc(article.title)}</h1>
          ${article.summary ? `<p class="article-dek">${esc(article.summary)}</p>` : ''}
          <div class="article-meta">${meta}</div>
          ${article.image ? `<img class="article-hero-image" src="${esc(article.image)}" alt="${esc(article.imageAlt || article.title)}" decoding="async">` : ''}
          <div class="article-body">${renderBody(article.content)}</div>
          ${shareRow(article)}
          <a class="back-link" href="index.html">← Back to homepage</a>
        `;

        const copyBtn = document.getElementById('copy-link');
        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(window.location.href);
              copyBtn.textContent = 'Copied ✓';
            } catch {
              copyBtn.textContent = 'Copy failed';
            }
            setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 2000);
          });
        }

        // Structured data for search engines
        const ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'NewsArticle',
          headline: article.title,
          description: article.summary || '',
          datePublished: article.date,
          author: article.author ? { '@type': 'Person', name: article.author } : undefined,
          image: article.image || undefined,
          publisher: { '@type': 'Organization', name: 'MeridianMatters' }
        });
        document.head.appendChild(ld);

        // Related stories from the same section
        const related = articles
          .filter((a) => a.category === article.category && a.id !== article.id)
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .slice(0, 3);
        if (related.length) {
          document.getElementById('related-list').innerHTML = related.map(window.MM.createArticleCard).join('');
          document.getElementById('related').hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
