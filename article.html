<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article – MeridianMatters</title>
  <meta name="description" content="Read the full article on MeridianMatters.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .article-page { max-width: 720px; margin: 0 auto; padding: 2.25rem 0 4rem; }
    .article-page .back-link {
      display: inline-flex; align-items: center; gap: 0.35rem; margin-bottom: 1.5rem;
      font-family: var(--font-mono); font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--accent); font-weight: 600;
    }
    .article-page .back-link:hover { color: var(--accent-hover); }
    .article-page .category-tag {
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 0.75rem;
    }
    .article-page h1 {
      font-family: var(--font-display); font-size: clamp(1.7rem, 4.2vw, 2.5rem);
      font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 1rem;
    }
    .article-page .meta {
      font-family: var(--font-mono); color: var(--text-muted); font-size: 0.82rem;
      text-transform: uppercase; letter-spacing: 0.02em;
      margin-bottom: 1.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule);
      display: flex; flex-wrap: wrap; gap: 0.6rem;
    }
    .article-page .hero-image {
      width: 100%; border-radius: 0; margin-bottom: 2rem; aspect-ratio: 16/9;
      object-fit: cover; background: var(--bg-alt);
    }
    .article-page .content { font-size: 1.08rem; line-height: 1.75; color: var(--text); font-family: var(--font-body); }
    .article-page .content p { margin-bottom: 1.25rem; }
    .article-page .loading, .article-page .error { color: var(--text-muted); padding: 3rem 0; text-align: center; font-family: var(--font-mono); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Meridian<span>Matters</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="news.html">Global News</a>
        <a href="sports.html">Sports</a>
        <a href="health.html">Health</a>
        <a href="finance.html">Finance</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"></button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div class="wire-ticker" id="wire-ticker"></div>

  <main>
    <div class="container">
      <article class="article-page" id="article-root">
        <p class="loading">Loading article...</p>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo">Meridian<span>Matters</span></div>
          <p>Your trusted source for global news, sports, health, and finance insights.</p>
        </div>
        <div class="footer-links">
          <div>
            <h4>Sections</h4>
            <a href="news.html">Global News</a>
            <a href="sports.html">Sports</a>
            <a href="health.html">Health</a>
            <a href="finance.html">Finance</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2026 MeridianMatters. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (async function () {
      const root = document.getElementById('article-root');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        root.innerHTML = '<p class="error">Article not found.</p>';
        return;
      }

      try {
        const res = await fetch('data/articles.json?t=' + Date.now());
        const data = await res.json();
        const article = (data.articles || []).find(a => a.id === id);

        if (!article) {
          root.innerHTML = '<p class="error">Article not found.</p>';
          return;
        }

        document.title = article.title + ' – MeridianMatters';

        const categoryMap = { news: 'Global News', sports: 'Sports', health: 'Health', finance: 'Finance' };
        const categoryLabel = categoryMap[article.category] || article.category;
        const dateStr = new Date(article.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        let bodyHtml = '';
        if (article.content) {
          const paragraphs = article.content.split(/\n+/).filter(p => p.trim());
          bodyHtml = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
        }

        root.innerHTML = `
          <a href="javascript:history.back()" class="back-link">← Back</a>
          <div class="category-tag">${categoryLabel}</div>
          <h1>${article.title}</h1>
          <div class="meta">
            <span>${dateStr}</span>
            <span>·</span>
            <span>By ${article.author}</span>
          </div>
          ${article.image ? `<img class="hero-image" src="${article.image}" alt="${article.imageAlt || article.title}" loading="lazy">` : ''}
          <div class="content">
            ${bodyHtml || `<p>${article.summary}</p>`}
          </div>
        `;
      } catch (err) {
        console.error(err);
        root.innerHTML = '<p class="error">Failed to load article.</p>';
      }
    })();
  </script>
</body>
</html>
