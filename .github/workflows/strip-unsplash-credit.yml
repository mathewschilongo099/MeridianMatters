name: One-time - Strip Unsplash Credit

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cleanup script
        run: node scripts/strip-unsplash-credit.js

      - name: Commit and push if changed
        run: |
          git config user.name "MeridianMatters Bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet data/articles.json; then
            git add data/articles.json
            git commit -m "One-time: strip / Unsplash from existing credits"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
